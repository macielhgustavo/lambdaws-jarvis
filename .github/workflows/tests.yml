name: tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Sync
        run: uv sync
      - name: Compile
        run: uv run python -m py_compile core.py jarvis_cli.py jarvis_gui.py test_core.py test_gui.py test_architecture.py jarvis_arch/*.py
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python -m unittest -q test_core.py test_gui.py test_architecture.py
